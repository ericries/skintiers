# Canonical roster of the standard SkinTiers session crons. The daily watchdog cron
# reads this and re-creates (via CronCreate) any roster entry not currently present in
# CronList, so the fleet survives the 7-day session-cron expiry as long as the session
# lives. Session crons die when Claude exits; this cannot make them durable across that.
#
# Each entry: `cron` (5-field, local time) + `prompt`. The type-fill prompts share one
# template (below); the watchdog recreates them verbatim, substituting {TYPE}/{type}/
# {CRITIC}/{PUBLISH} from each entry.
#
# DESIGN NOTE (2026-08-05, from user feedback): page types are NOT equal. The core
# value is product reviews + evidence tier lists, backed by ingredient evidence.
# Brand/person pages are DISCOVERY AIDS (short, link-heavy). Study pages are AGENT-FACING
# infrastructure (compact structured facts for routine analysis), not reader essays.
# The template enforces per-type scope + token discipline so effort concentrates on the
# catalog and tiers, not on verbose supporting prose. Every content queue is touched daily
# (product 4x/day); brand/person stay LEAN + Sonnet-only (inline draft, no Opus critic) so
# a daily cadence there is cheap. Prefer Sonnet wherever appropriate; reserve the Opus
# critic for the numeric health-claim verification on product/ingredient/study pages.

_fill_template: |
  [SkinTiers daily fill: {TYPE}] Do ONE small bounded batch for the {TYPE} type ONLY, then stop. KEEP TOKEN USE LOW.

  PURPOSE & SCOPE (this decides how much to write — obey it):
  - The site's CORE VALUE is product reviews + evidence tier lists, backed by ingredient evidence. Concentrate effort there.
  - product / ingredient: CORE. Write the full standard page (product-page standard / prose "## The Rubric"). Worth the depth and the Opus critic.
  - list: CORE (best-of / tier lists / routines). Curatorial over pages that ALREADY exist; keep any tier_list block; be concise, no padding.
  - condition / goal: hubs that drive DISCOVERY and host topic tier lists. Keep prose tight; PREFER adding/maintaining a tier_list of the graded items over a long essay.
  - brand: DISCOVERY AID ONLY. LEAN, <=180 words: what it is, founder in one line, and a linked list of its products/ingredients ALREADY on the site. NO founding-history or positioning essay. Attribute any brand claim as the brand's own. Its job is to link to products.
  - person: DISCOVERY AID ONLY. LEAN, <=150 words: who they are, an honest credential, and the products/videos they point to (linked). NO biography essay. Never state an unverified claim about a living person.
  - study: AGENT-FACING INFRASTRUCTURE for routine analysis, NOT a reader essay. COMPACT + structured: one line on what it tested; design/population/n; intervention vs comparator; the PRIMARY result with the numbers; effect size; who it generalizes to; the one key limitation. Do NOT re-tell the ingredient's general story — link out.
  NEVER re-explain what another page already owns — link out in ONE clause. Redundant prose is the enemy of this site.
  TOKEN DISCIPLINE: bound research hard (stop at the few sources you actually need). For brand/person (lean, low-risk) do the draft INLINE in the main loop — do NOT spawn a subagent. For product/ingredient/study/list, ONE Sonnet subagent may draft; keep its prompt tight and its fetches few.

  STEP 1: fill ONE page — prefer an existing {type} stub, else the next queued item
  (`.venv/bin/python scripts/sk queue-next --type {type}`); if neither exists, skip STEP 1 (do not invent
  work). Follow docs/writing-guide.md + docs/anti-ai-ese.md, SCALED to the scope above.
  SOURCE CACHING: for every source you CITE whose domain is NOT a durable primary (the ones sk verify flags
  "verify manually", i.e. sklib classify_domain=='unknown'), pipe the fetched text to
  `python scripts/source_cache.py put <url>` right after fetching it, so it can be verified later even if the
  live site blocks a re-fetch. A load-bearing verbatim quote from such a source REQUIRES a cache entry.
  {CRITIC}. The critic MUST verify cited non-primary sources against the local cache first
  (`python scripts/source_cache.py get <url>`), live-fetching only on a cache miss. Keep status:draft during
  work; publish only once sk lint+verify+style are clean {PUBLISH}. Record the review in data/review-log.yaml.
  STEP 2 (main loop, no subagent): add 2-5 REAL grounded candidates (name + source) to OTHER type queues via
  `sk queue-add` — bias toward PRODUCTS and INGREDIENTS (the catalog), since brand/person/study exist mainly to
  surface those. Then commit the shipped page, build, and push (git pull --rebase then push if rejected).
  One-line summary. (What's New is auto-derived from each page's `updated` date - do NOT run `sk log`.)

crons:
  - cron: "41 */6 * * *"
    type: product
    critic: "Because products make health/efficacy claims, one Opus profile-reviewer critic MUST re-verify every quote/stat/price/composition figure against the REAL source before publish"
    publish: "and the critic returns verdict publish (else --force publishes at assurance=sonnet)"
  - cron: "9 9 * * *"
    type: study
    critic: "Because studies make health claims, one Opus profile-reviewer critic MUST re-verify every quote and statistic against the REAL source (the PubMed URL) before publish. Keep the page COMPACT + structured (see scope) — the critic checks the numbers, it is not a license to pad"
    publish: "and the critic returns verdict publish"
  - cron: "31 12 * * *"
    type: ingredient
    critic: "Because ingredients make health/efficacy claims, one Opus profile-reviewer critic MUST re-verify every quote and statistic against the REAL source before publish"
    publish: "and the critic returns verdict publish"
  - cron: "29 15 * * *"
    type: condition
    critic: "Because conditions make health claims, one Opus profile-reviewer critic MUST re-verify every quote and statistic against the REAL source before publish"
    publish: "and the critic returns verdict publish"
  - cron: "37 16 * * *"
    type: goal
    critic: "Because goals make health/efficacy claims, one Opus profile-reviewer critic MUST re-verify every quote and statistic against the REAL source before publish"
    publish: "and the critic returns verdict publish"
  - cron: "17 10 * * *"
    type: person
    critic: "LEAN discovery card (see scope), drafted INLINE (no subagent). A Sonnet-quality draft + your own lint/verify/style check is enough — do NOT spawn an Opus critic. Never state an unverified claim about a living person"
    publish: "(person pages have no critic verdict; use --force after your own check)"
  - cron: "43 13 * * *"
    type: brand
    critic: "LEAN discovery roll-up (see scope), drafted INLINE (no subagent). A short draft + your own check is enough — do NOT spawn an Opus critic. Attribute brand marketing claims as the brand's own, not fact"
    publish: "(brand pages have no critic verdict; use --force after your own check)"
  - cron: "23 11 * * *"
    type: list
    critic: "Lists are curatorial but cite health claims: a Sonnet draft + your own check; spot-verify any load-bearing stat against its source"
    publish: "(use --force after your own check)"
  - cron: "43 1,7,13,19 * * *"
    label: video-pull
    prompt: |
      [SkinTiers daily video pull] Do ONE small bounded batch, then stop. KEEP TOKEN USE LOW; MAIN-LOOP work only (no subagents). Add a few of ONE vetted expert's recent, NON-SPONSORED, transcript-verified videos as embedded videos: cards on the most relevant existing pages. This runs several times a day to keep the Feed page fresh.

      STEP 1 - Pick the creator: read data/video-sources.yaml, pick the entry with the oldest or null last_pulled (ties: first listed). Use its name, creator_slug, credential, channel, conflict, product_recs.
      STEP 2 - List recent uploads: `yt-dlp --flat-playlist --playlist-end 15 --no-warnings --print "%(id)s\t%(title)s" <channel>`. Choose UP TO 3 candidates whose TITLE is about a topic the site already has a page for: a named product, an ingredient/topic (retinoids, niacinamide, vitamin C, azelaic/salicylic/glycolic acid, sunscreen/SPF, ceramides, hyaluronic acid, peptides), OR a skin CONDITION or GOAL the site covers (rosacea, melasma, acne, anti-aging). Skip vague vlogs, GRWM, and any #ad/sponsored title. PRODUCT-REC and FAVORITES videos (a "which product(s) I like and why"): eligible when the creator is credibility-vetted - tier HIGH (derm/chemist) OR product_recs: ok in the roster. CREDIBILITY, not credential, is the gate (user 2026-08-14): a vetted creator's non-sponsored single-product rec OR multi-product favorites video is fine (embed on the most relevant page, use related: for the others). For a MED creator WITHOUT product_recs: ok, still prefer educational/how-to. Always: reject sponsored/affiliate/gifted (STEP 3b); a creator who monetizes picks via an affiliate storefront (e.g. Kristin Leite) has favorites/picks treated as effectively paid, so skip those; and never relay an overstated efficacy claim as fact even from a vetted creator.
      STEP 3 - For EACH chosen video (STOP after at most 3 cards):
        a. `.venv/bin/python scripts/yt_transcript.py <id>`. No transcript -> skip.
        b. MANDATORY sponsorship scan of the transcript (sponsor, sponsored, #ad, paid partnership, "thank you <brand> for sponsoring", gifted, "brought to you by", "use my code", affiliate callouts). ANY present -> REJECT. Reject brand-channel uploads.
        c. READ the transcript; it must be genuine education/how-to/which-product-they-like. If the creator has an own-brand conflict and the video mainly promotes their own product, skip.
        d. Pick the MOST relevant EXISTING page to EMBED the card on (where it renders in full): a specific product page, else the ingredient/topic page, else a condition or goal hub page the video is about (data/products, data/ingredients, data/conditions, data/goals). No relevant page -> SKIP (do not create pages).
        e. `grep -rl "<id>" data/` - if the id is already used anywhere, skip (no duplicates).
        f. Add a videos: entry (add the videos: key if absent): title, creator, creator_slug, credential (from the roster), platform: YouTube, url: https://www.youtube.com/watch?v=<id>, posted (the video's ORIGINAL upload date as 'YYYY-MM-DD', from `yt-dlp --skip-download --no-warnings --print "%(upload_date)s" <url>` reformatted; this is what orders the Feed page), thesis, related (see below), note: "Verified from the video's transcript (yt-dlp, read in full); no sponsorship." The THESIS is 2-3 sentences GROUNDED IN THE TRANSCRIPT (only what they actually said, never fabricate a number/claim) and MUST be SELF-CONTAINED for a lay reader who does not know this creator or video: (1) name the product/ingredient/topic explicitly as the subject, never a bare "this"/"it"; (2) introduce the creator with their credential on first mention (e.g. "cosmetic chemist Michelle Wong", "dermatologist Dr Dray"); (3) read clearly on its own. No em/en-dashes; no site self-reference.
          `related:` is a YAML list of the slugs of EVERY OTHER existing page the video is genuinely about, beyond the one page you embedded it on (the ingredient AND the condition/goal AND any specific product pages named in the thesis). Use ONLY slugs of pages that already exist (check with `ls data/*/` / the linked slugs), never invent one; omit the embed page itself. This is what makes each Feed entry link to every appropriate page, not just its home. Example: a "retinoids for acne" video embedded on data/ingredients/retinol.md gets `related: [acne, tretinoin, retinoids]` if those pages exist. If there are no other relevant existing pages, omit `related`.
      STEP 4 - Set that creator's last_pulled to today's date in data/video-sources.yaml (advance rotation even if 0 cards added).
      STEP 5 - `.venv/bin/python scripts/sk lint <slug>` + `sk style <slug>` on each touched page (fix issues), `.venv/bin/python build.py`, `.venv/bin/python scripts/sk log "..."` a What's New line naming the creator + what was added, commit and push (git pull --rebase then push if rejected). One-line summary: creator + cards added (page + video), or "none found" with why.
  - cron: "13 3,11,19 * * *"
    label: product-images
    prompt: |
      [SkinTiers product images] Populate real product photos for products that lack them. Do ONE bounded batch then stop. KEEP TOKEN USE MODERATE.

      STEP 1: list up to 5 products with NO images: frontmatter:
      `for f in data/products/*.md; do grep -q "^images:" "$f" || basename "$f" .md; done | head -5`
      If none, stop (nothing to do).

      STEP 2: spawn ONE Sonnet subagent (effort medium) to handle exactly those 5 products. For EACH product it must:
        a. Read the product page for its real brand + retailer URLs (the footnote source URLs and Where-to-Buy links already on the page are the best leads).
        b. Fetch a brand or major-retailer product page and extract a REAL photo URL of THIS EXACT product (the og:image meta tag or the main product image). It must be the product itself, NOT a logo, banner, model shot, or unrelated image. If unsure or none is found, SKIP that product (never guess or fabricate an image).
        c. Self-host it: `curl -sL "<url>" -o static/images/<slug>-<source>.jpg` then VERIFY it is a real image (`file static/images/<slug>-<source>.jpg` reports image data AND size > 3KB). If it is HTML/an error page/too small, delete it and skip.
        d. Add an images: block to the frontmatter (after the category: or brand: line) with file/source/source_url per the site convention (reference data/products/cosrx-the-retinol-0-1-cream.md). 1-2 genuine product photos max. Attribute the source honestly.
        e. Run `.venv/bin/python scripts/sk lint <slug>` and fix issues.
      STEP 3 (main loop): `.venv/bin/python build.py`; confirm each touched product now renders a thumb (`grep -c 'thumb' _site/<slug>.html`). Commit (`git add data/products static/images && git commit -m "images: real product photos for N products (image cron)"`) and push (git pull --rebase then push if rejected). One-line summary: which products got images, which were skipped and why. Do NOT draft or change any other page content.
  - cron: "47 8 * * *"
    label: pubmed-ingest
    prompt: |
      [SkinTiers PubMed ingest] Run exactly: `.venv/bin/python scripts/ingest_pubmed.py`. It auto-adds new
      high-quality dermatology studies to the study queue (dedup by PMID). If data/queues/studies.yaml
      changed, commit and push it. KEEP TOKEN USE MINIMAL: run the script, commit if changed, stop.
