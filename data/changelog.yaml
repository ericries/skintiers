- date: '2026-08-03'
  title: Routine steps now show a standardized product badge — each product's photo cropped to a uniform
    square inside a tier-colored frame (green for top-tier, amber for moderate), so a routine reads at
    a glance as a row of consistent, ranked product thumbnails.
- date: '2026-08-03'
  title: Routine dashboards now flag layered actives (e.g. niacinamide x4 in the oily-skin routine) and
    list the notable actives a routine leaves out (vitamin C, a retinoid, an exfoliating acid, etc.) —
    shown for information, not as a shortcoming.
- date: '2026-08-03'
  title: 'Added a detailed lay summary of Dhaliwal 2019 — the pivotal double-blind RCT behind ''bakuchiol
    is a gentler retinol alternative'': over 12 weeks both cut wrinkles and pigmentation equally, but
    retinol caused more scaling and stinging. It compares bakuchiol to retinol (a mild OTC form), not
    to prescription tretinoin.'
- date: '2026-08-03'
  title: Routine dashboards now span three concerns — added A Rosacea-Friendly Routine and An Oily-Skin
    K-Beauty Routine — and every routine shows a single 'how well it works' strength read (Strong/Solid/Moderate/Light)
    computed from its products' grades.
- date: '2026-08-03'
  title: 'Added SkinMedica Retinol Complex 1.0 — a $96 Wirecutter ''best for mature skin'' retinol pick.
    Notable for what its label leaves out: no retinol percentage is disclosed (''1.0'' is just a tier
    name), so its case rests on category-level retinol evidence, and cheaper OTC retinoids (including
    an FDA-cleared one) exist.'
- date: '2026-08-03'
  title: 'Routine visualization (rudimentary): kind:routine list pages now get an auto-computed at-a-glance
    dashboard — tier distribution, active-ingredients-as-a-whole, what it''s good for, and AM/PM steps
    with per-step effect. First one live: A Minimal, Evidence-Led Acne Routine.'
- date: '2026-08-03'
  title: Added Trader Joe's Vitamin C Serum — the viral $9.99 'SkinCeuticals dupe.' Its label really does
    state 15% L-ascorbic / 1% vitamin E / 0.5% ferulic (the studied CEF concentrations), but no trial
    or stability test of this product exists and its base differs; separated it from Trader Joe's older
    ester-based Nourish serum.
- date: '2026-08-01'
  title: Added Timeless 20% Vitamin C + E Ferulic Acid Serum — a ~$28 L-ascorbic/E/ferulic serum widely
    cited as a SkinCeuticals C E Ferulic dupe, with the oxidation/shelf-life caveat covered honestly.
