- name: Chemical peels for acne scars and texture
  type: goal
  priority: 5
  status: done
  discovered_from: platelet-rich-plasma-acne-scars
  source: 'The add-on that actually WON in two of the three analyses behind platelet-rich-plasma-acne-scars,
    and the site has no page for it. PMID 39110247 (24 studies, 1546 participants):
    microneedling combined with chemical peels gave the best results on degree of
    improvement, patient satisfaction AND treatment efficacy, beating microneedling
    with PRP and PRP alone. PMID 41081097: laser plus chemical peels ranked best in
    patient satisfaction (SUCRA 89.6%). Chemical peels are also far cheaper and more
    widely available than laser or PRP, so this is a high-value gap. Resolve which
    peel agents and depths the trials used before grading.'
- name: Home-use fractional nonablative laser devices
  type: goal
  priority: 5
  status: pending
  discovered_from: home-use-skincare-devices-by-evidence
  source: 'The HIGHEST-graded home device modality in PMID 42545315 and the only Level
    A row on home-use-skincare-devices-by-evidence, described as showing ''high-quality
    evidence (Level A) with consistent clinical improvement'' for facial rejuvenation.
    The site cannot currently point a reader at the best-evidenced thing the review
    found, which is the single largest gap in that ladder. MUST be kept distinct from
    fractional-co2-laser-resurfacing: nonablative home device vs in-office ablative
    procedure, different wavelength class, power and setting; the Level A grade does
    not transfer. Resolve which specific home devices the review''s underlying studies
    used before grading.'
- name: Home radiofrequency skin-tightening devices
  type: goal
  priority: 5
  status: pending
  discovered_from: home-use-skincare-devices-by-evidence
  source: Graded Level B for facial rejuvenation alongside LED in PMID 42545315, and
    named in the review's conclusion among the modalities that 'demonstrate the most
    favorable balance of efficacy and safety'. One of the six rungs on home-use-skincare-devices-by-evidence
    with no page. Check whether any FDA 510(k) cleared home RF devices exist via the
    openFDA device/510k API before drafting, as was done for the reVive LED device.
- name: Mohs micrographic surgery
  type: goal
  priority: 5
  status: pending
  discovered_from: keratinocyte-carcinoma
  source: 'Listed by NCI PDQ as a treatment option for localized BCC and SCC, and
    the procedure specifically indicated where margins matter most. Grounded directly
    in the PDQ fact already on keratinocyte-carcinoma: high-risk recurrence sites
    are ''the central face (e.g., periorbital region, eyelids, nasolabial fold, or
    nose-cheek angle), postauricular region, pinna, ear canal, forehead, and scalp'',
    and the morpheaform BCC subtype is hard to treat conventionally because of ''indistinct
    clinical tumor margins''. That is the case for margin-controlled excision in one
    sentence. The site covers subcision, microneedling and fractional CO2 as procedure
    pages, so the format exists.'
- name: Thickened or scaly skin patches (hyperkeratosis)
  type: goal
  priority: 5
  status: pending
  discovered_from: smoothing-skin-texture
  source: The one texture problem the smoothing-skin-texture hub routes AWAY from
    without having anywhere to send it. That page's medical note tells readers that
    scaly patches fixed in one spot are worth showing a dermatologist rather than
    exfoliating harder, and keratosis-pilaris covers only the upper-arm case. The
    site has urea and ammonium-lactate as graded keratolytics with no condition hub
    tying them to thickened skin. Build from dermatology references on hyperkeratosis;
    keep actinic-keratosis strictly separate, since that one is a precursor lesion
    covered under keratinocyte-carcinoma.
- name: 'LED dose: what J/cm2 and wavelength actually tell you'
  type: goal
  priority: 5
  status: pending
  discovered_from: pulsaderm-acne-mask-28
  source: 'Pulsaderm K170111 is the first home LED clearance on this site to publish
    energy per session (20.44 and 22.72 J/cm2) alongside wavelengths and a 30-treatment
    course, and the GRADE review behind the whole device ladder (PMID 42545315) reports
    NO dose at all. That mismatch is the page: consumers are given dose numbers they
    cannot check against the evidence. Collect the dosing actually used in the blue
    and blue-red LED acne trials underpinning the Level B grade, and state plainly
    if those doses are not recoverable from the available abstracts rather than implying
    a comparison that cannot be made.'
- name: Chemical peels for acne scars (the combination that won patient satisfaction)
  type: goal
  priority: 5
  status: pending
  discovered_from: acne-scar-procedures-by-evidence
  source: PMID 41081097 ranks laser plus chemical peels BEST for patient satisfaction
    at SUCRA 89.6%, and the site has no chemical-peel page at all, so the new acne-scar-procedures-by-evidence
    list cannot include the satisfaction winner. That is the biggest hole in the list.
    Grade the peel itself and the laser-plus-peel combination separately, and do not
    let a satisfaction rank stand in for a severity rank.
- name: Dermal filler injection for atrophic acne scars
  type: goal
  priority: 5
  status: pending
  discovered_from: acne-scar-procedures-by-evidence
  source: 'PMID 41081097 ranks laser plus filler injection BEST on the Goodman and
    Baron Scale, though at a weakly separated SUCRA of 72.1%. No filler page exists,
    so the list is missing one of its two severity winners. Note the SUCRA caveat
    when grading: 72.1% is compatible with several options being nearly as good, unlike
    the 98.4% for laser plus PRP.'
- name: Jessner and combination peels for post-acne texture
  type: goal
  priority: 5
  status: pending
  discovered_from: chemical-peels-acne-scars
  source: 'Grounded in the gap the new chemical-peels-acne-scars page names explicitly:
    all three network meta-analyses treat ''chemical peel'' as a single node and none
    states the agent or depth, so a reader cannot act on the finding. Only build this
    if a primary source actually compares named peel formulations head to head; if
    the literature genuinely does not support it, strengthen the agent-unknown section
    on chemical-peels-acne-scars instead and resolve this entry with that note.'
- name: 'Exfoliation: chemical versus physical, and how it differs from cell turnover'
  type: goal
  priority: 5
  status: pending
  discovered_from: retinoids
  source: 'GENUINE GAP found while carding a TikTok clip: the site has salicylic-acid,
    glycolic-acid, lactic-acid and mandelic-acid pages but NO hub for exfoliation
    itself, so a clip whose whole point is the distinction between exfoliating acids
    and retinoid-driven cell turnover had to be attached to retinoids instead. Checked
    2026-10-19: nothing matches exfoliat* or cell-turnover under data/goals or data/ingredients.
    A hub should grade AHA vs BHA vs PHA vs LHA by evidence and state plainly that
    removing dead cells is not the same mechanism as increasing turnover.'
- name: Aftercare and recovery following ablative laser resurfacing
  type: goal
  priority: 5
  status: pending
  discovered_from: karimi-2025-neurocosmetic-post-procedure-cream
  source: 'The site has fractional-co2-laser-resurfacing for the procedure but nothing
    on what to put on skin afterwards, which is the question patients actually ask
    and the gap PMID 40911753 tried to address with an unnamed cream and no numbers.
    Build it from real evidence: look for controlled trials of petrolatum or plain
    occlusives versus branded post-procedure products, and state plainly if the controlled
    evidence is thin, which the Karimi record suggests it is. petrolatum already has
    a page. Do NOT cite PMID 40911753 as support for anything; the study page explains
    why.'
