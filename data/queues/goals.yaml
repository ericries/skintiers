    site covers sun-protective clothing only in passing and has no page for shade
    devices, which is a real gap in non-topical photoprotection. VERIFY THE PERCENTAGES
    INDEPENDENTLY before publishing: they are hers, spoken, and UPF testing standards
    for umbrellas are the primary source to find. Keep it distinct from sunscreen
    pages; the point of the page is that shade is a supplement to sunscreen, which
    is exactly what she says.'
