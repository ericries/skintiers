    treatment for BCC, and the site has NO page for it, which is why the Mohs page
    carries no tier_list: there is nothing to rank against. Building it would let
    a real treatment comparison live on keratinocyte-carcinoma. Use the SAME trial
    as the spine and keep the p-values straight: 10-year recurrence 12.2% for excision
    vs 4.4% for Mohs in high-risk PRIMARY facial BCC at p=0.100 (not significant),
    and 13.5% vs 3.9% in RECURRENT facial BCC at p=0.023 (significant).'
