    from the videos, then the videos can attach.'
- name: 'Home microneedling devices: the infection risk the evidence actually flags'
  type: goal
  priority: 5
  status: pending
  discovered_from: home-fractional-nonablative-laser
  source: 'The sharpest safety finding in PMID 42545315 and nothing on the site states
    it: for facial rejuvenation, ''microneedling devices were supported by low-quality
    evidence (Level D) and associated with infectious complications''. The microneedling
    page covers the PROCEDURE and carries a dermatologist video recommending a home
    stamping device, so the Level D plus infection finding needs to sit somewhere
    a home-device shopper will see it. Decide whether this belongs as a section on
    microneedling rather than a new page; if so, resolve this entry with that note.
    Source the infection mechanism from a primary, not from the scoping review abstract,
    which gives no detail.'
- name: 'How to read a sunscreen label: actives versus inactives, and what a mineral
    claim does not guarantee'
  type: goal
  priority: 5
  status: pending
  discovered_from: zinc-oxide
  source: 'Grounded in video Q6CcxuAGbb8 and in a real regulatory asymmetry the site
    has not explained anywhere: in the US an organic UV-filter-like molecule regulated
    as a COSMETIC ingredient appears in the inactive list, while FDA-recognised sunscreen
    filters appear as actives, so a product can be front-labelled mineral and still
    contain organic filters. The site has sunscreen-uv-filters, zinc-oxide and titanium-dioxide
    but nothing that teaches label reading. Source the regulatory distinction from
    the FDA sunscreen monograph rather than from the video, then the video can attach.'
