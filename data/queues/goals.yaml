- name: Erbium:YAG fractional laser resurfacing
  type: goal
  priority: 5
  status: pending
  discovered_from: acne-scar-treatments-by-downtime-and-pain
  source: 'The comparator in PMID 42720808 and the only arm of that meta-analysis
    with no page here, which is why the new downtime list can grade fractional CO2
    but not its alternative. The numbers to carry: against erbium, CO2 had greater
    pain (MD 1.86, 95% CI 1.33-2.39) and longer downtime (MD 3.67 days, 95% CI 1.90-5.44),
    while its efficacy edge did NOT survive the randomized-only analysis (RR 0.76,
    95% CI 0.54-1.08). Five studies, 130 analyzed participants, so flag the small
    n. Erbium is also the laser type named in PMID 40911753 for lower-eyelid work.'
