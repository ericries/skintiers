    been measured, and route readers to anti-aging. BUILD CAUTIOUSLY: do not accept
    the category''s own framing, and do not assert that no evidence exists either.
    Her petri-dish-biomarker objection is the right spine; find the actual claims
    brands make and check what each rests on.'
- name: Surgical excision (standard excision for skin cancer)
  type: goal
  priority: 5
  status: pending
  discovered_from: mohs-micrographic-surgery
