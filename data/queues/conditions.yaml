    ALSO NOTED 2026-11-07, same class of mistake found twice in one tick: I queued
    a ''Skin laxity and crepey skin'' condition on 2026-11-07 that turned out to duplicate
    the existing [[skin-firmness-elasticity]] goal page, which already covers laxity
