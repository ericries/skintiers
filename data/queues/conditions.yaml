  discovered_from: foreo-faq-led-masks
  source: 'Surfaced because FAQ 302 (K242747) is cleared specifically ''to promote
    hair growth in males with androgenetic alopecia'' and the site has no hub for
    it, so the FOREO page cannot route readers anywhere. Note the site also lacks
    a minoxidil page (checked 2026-10-18), and several rostered dermatology creators
    have hair-loss videos that currently have nowhere to attach. If hair is in scope
    this is the entry point; if it is not, resolve this entry with that decision recorded
    so it stops resurfacing. NOT created as a separate page. The site already has
    data/conditions/hair-loss-thinning.md (updated 2026-08-30), which covers pattern
    loss, minoxidil 5% vs 2%, telogen effluvium, ketoconazole as an adjunct and PCOS,
    and which already draws a scope line placing prescription systemics (finasteride,
    spironolactone) and procedures outside this site''s scope. I drafted androgenetic-alopecia.md
    before finding that hub via foreo-faq-302''s See Also, then removed it unshipped
    rather than publish a duplicate whose oral-drug spine also crossed that existing
    scope line. Folded the genuinely new, in-scope material into the existing hub
    instead: the microneedling systematic review as an adjunct-only case with its
    low-quality and conflicted-authorship caveats, the fact that the best comparative
    drug analysis ranks orals above the one OTC option, that it is male-only, and
    that no light or laser device appears in it so nothing ranks the site''s hair
    devices against minoxidil.'
- name: 'Athlete''s foot: strengthen the interdigital versus moccasin-pattern distinction'
  type: condition
  priority: 5
  status: done
  discovered_from: lotrimin-ultra-athletes-foot-cream
  source: 'MAINTENANCE, not a new hub: do NOT create a separate moccasin-tinea page,
    strengthen the existing athletes-foot page. Grounded in a label admission: Lotrimin
    Ultra claims to cure most athlete''s foot BETWEEN THE TOES and states that ''Effectiveness
    on the bottom or sides of foot is unknown''. So the pattern on the sole and sides
    is both common and outside what at least one FDA-approved product claims. The
    athletes-foot page should say which products are labelled for which pattern, since
    that determines whether a purchase can work at all. Check the other antifungal
    labels for the same sentence before generalising. NOTE 2026-10-19: a second label
    finding for the same section. The clotrimazole SKU branded Lotrimin AF (NDC 11523-6549)
    claims ONLY ringworm in its Uses section, so a shopper reaching for an AF-branded
    tube may buy a product that makes no athlete''s foot claim at all. Alongside Lotrimin
    Ultra''s admission that effectiveness on the bottom or sides of the foot is unknown,
    athletes-foot now has two sourced reasons to tell readers to read the Uses section
    rather than the brand name. Done, with one correction to the premise: the queue
    framed it as a TWO-pattern distinction, and the 2023 Drugs in Context review (PMID
    37415917) says ''Three main clinical forms of tinea pedis are recognized: interdigital,
    hyperkeratotic (moccasin-type) and vesiculobullous (inflammatory)''. The vesiculobullous
    form is now named and flagged as the one the OTC labels do not address at all.
    The hub already covered the locations well in lay terms but the words moccasin
    and interdigital appeared ZERO times, which was the real discovery gap; added
    as prose plus frontmatter aliases so clinical searches resolve. Also linked the
    two product pages carrying the label split (lamisil-at vs lotrimin-ultra), which
    the hub referenced only at active-ingredient level, and added the review''s ''The
    accuracy of clinical diagnosis of tinea pedis is low'' to the diagnosis section.'
