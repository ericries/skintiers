    the two features that put a nail outside the population where the 17.8% complete-cure
    figure applies, so a reader with a dermatophytoma is reading the wrong number.
    Confirm the clinical definition from a primary dermatology source before drafting;
    keep it tight and route treatment to onychomycosis.
