    (tinea pedis) as a condition hub but nothing for body ringworm, even though it
    is the indication both labels lead with. Note the evidence asymmetry worth building
    the page on: Crawford 2007 covers the FOOT only, so the body-ringworm indication
    rests on the monograph rather than on that pooled trial evidence.'
- name: Blue light and eye safety in home skincare devices
  type: condition
  priority: 5
  status: done
  discovered_from: neutrogena-light-therapy-acne-mask-plus
  source: 'Grounded in a gap the Neutrogena page had to leave open. Its K180847 summary
    cites consensus standards including a collateral standard for non-laser light
    sources and one for the home healthcare environment, and the reVive K223482 summary
    separately claims its optics ''limit light scattering and exposure to the eyes''
    and that it ''has gone through all the clinical testing for eye safety''. Two
    cleared home LED devices both treat ocular exposure as the safety question, and
    the site has no page on it. STRICT SOURCING REQUIRED: build only from FDA clearance
    documents and standards bodies. Do NOT assert or repeat the widely-reported Neutrogena
    eye-safety withdrawal, which could not be confirmed in openFDA recall, enforcement
    or registration data on 2026-10-16.'
- name: 'Sensitive skin: what the label means and what it does not'
  type: condition
  priority: 5
  status: done
  discovered_from: wang-2025-encorelane-sensitive-skin
  source: 'The site has a sensitive-skin page, but this study surfaces a definitional
    problem worth its own treatment: subjects were ''sensitive-skin subjects'' by
    self-identification, and the in vitro arm models sensitivity by irritating a 3D
    epidermal culture with sodium lauryl sulfate. Those are two very different constructs,
    and cosmetic trials routinely slide between them. A page on how sensitive skin
    is actually defined and measured (self-report, lactic acid sting test, SLS provocation,
    capsaicin) would let every future sensitive-skin claim on the site be read against
    a real definition. Check whether this belongs as a section on the existing sensitive-skin
    page before creating a separate hub.'
- name: Moccasin-type tinea pedis (sole and sides of the foot)
  type: condition
  priority: 5
  status: done
  discovered_from: butenafine
  source: 'Grounded in a gap the butenafine label itself names: it claims to cure
    athlete''s foot BETWEEN THE TOES and then states ''Effectiveness on the bottom
    or sides of foot is unknown.'' The site has an athletes-foot hub but nothing distinguishing
    interdigital from moccasin-type distribution, even though the OTC labels treat
    them differently and at least one explicitly declines to claim the sole. That
    distinction decides whether an OTC cream is even the right purchase. Crawford
    2007 covers the foot broadly; check whether it or a newer review reports outcomes
    by distribution before grading.'
- name: Tinea cruris (jock itch)
  type: condition
  priority: 5
  status: done
  discovered_from: tinea-corporis-ringworm
  source: 'The third body-site tinea named alongside corporis and pedis in PMID 41118183,
    which groups them as the ones that ''generally respond to inexpensive topical
    antifungal agents''. The site now has athletes-foot (pedis), tinea-capitis and
    tinea-corporis-ringworm, leaving cruris as the obvious gap. THREE OTC labels already
    transcribed on this site carry an explicit jock-itch indication with their own
    dosing: butenafine (once daily, 2 weeks), plus the Lotrimin and Tinactin jock-itch
    SPLs which are SEPARATE setids from the ones already cited. Pull those SPLs rather
    than assuming the body-ringworm directions transfer.'
- name: Actinic cheilitis (sun damage on the lip)
  type: condition
  priority: 5
  status: done
  discovered_from: lip-care
  source: 'Grounded in PMID 35242781, already transcribed on lip-care: ''a precursor
    of malignancy or even an in situ squamous cell carcinoma (SCC) of the lip, located
    most frequently on the lower lip'', malignant transformation ''ranges from 10
    to 30%'', and lip SCC called ''one of the deadliest non-melanoma skin cancers''.
    The site has actinic-keratosis for ordinary skin and keratinocyte-carcinoma for
    the cancers, but nothing for the lip precursor, which is the single highest-stakes
    thing on the lip-care page and currently only gets a paragraph there. The review
    also notes ''Optimal treatment has not been established yet'', so the page must
    NOT imply a settled treatment hierarchy.'
- name: Rolling acne scars (tethered scars treated by subcision)
  type: condition
  priority: 5
  status: done
  discovered_from: acne-scar-procedures-by-evidence
  source: The new list had to note that the ECCA and Goodman and Baron severity scales
    do not isolate tethered rolling scars, which is exactly why subcision's rank cannot
    be read off a severity ranking. acne-scars covers all three post-acne categories
    at once; the rolling subtype is the one with a specific mechanism (fibrous tethers)
    and a specific procedure. Only build it if the subtype genuinely has its own evidence;
    otherwise strengthen the section on acne-scars instead.
