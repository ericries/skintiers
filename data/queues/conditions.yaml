    dry-skin page would be the sixth near-duplicate pair here. If it does not, the
    useful content is narrow: what xerosis means clinically, that trials grade its
    SEVERITY on scales the abstracts rarely explain, and that foot and body xerosis
    is where the keratolytic evidence actually lives rather than the face.'
