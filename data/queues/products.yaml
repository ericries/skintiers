    and its figures ARE now known secondhand: the K171390 predicate chart gives the
    Nuve 62.07 mW/cm2 over a 30 cm2 treatment area at 3 minutes. FIRST decide whether
    this is a second page or an enrichment of dpl-nuve (probably the latter), then
    read K141181 directly rather than relying on the successor''s chart. accessdata.fda.gov
    with a browser user-agent; expect a scan needing page rendering.'
