- name: El Global Trade (CurrentBody, sensiLift)
  type: brand
  priority: 4
  status: pending
  discovered_from: home-rf-devices-by-whose-evidence-the-file-rests-on
  source: 'The FDA applicant behind three of the eleven PAY-coded home RF clearances:
    CurrentBody Skin RF (K232424), sensiLift (K170499) and Sensilift Pro (K250341).
    This is the same one-applicant-several-brand-names pattern already documented
    for LED Technologies (dpl and reVive) and Silk''n, and it is the reason a shopper
    cannot read two shelf-neighbours as independent competitors. LEAN brand page under
    180 words whose job is to link currentbody-skin-rf and whatever sensiLift pages
    get built, and to record that the applicant name on the file is not the name on
    the box. openFDA route only; do not spend a metered call. SUPERSEDED in large
    part by the currentbody brand page shipped 2026-10-28, which already records the
    applicant split: El Global Trade, Ltd. of Netanya, Israel holds 12 clearances,
    all Summaries, including the CurrentBody Skin RF (K232424), sensiLift (K170499)
    and Sensilift Pro (K250341), and only one of the twelve carries the CurrentBody
    name. A separate El Global Trade page would now duplicate that unless it does
    something the brand page cannot: cover the sensiLight and IPL hair-removal line
    (OHT code, seven filings) and the sensiFirm / RF-Relief pair (PBX), which the
    CurrentBody page deliberately leaves alone. Decide that before building; if the
    answer is no, resolve this item as a duplicate.'
- name: Omnilux
  type: brand
  priority: 4
  status: pending
  discovered_from: omnilux-clear-u
  source: 'LEAN discovery aid for a brand with a genuinely unusual disclosure record:
    all 8 Omnilux clearances in openFDA are published as SUMMARIES rather than Statements,
    the opposite of FOREO''s 8-of-10 Statements. It also spans three corporate entities,
    Photo Therapeutics Limited (UK, first five filings), Photo Therapeutics Inc (Carlsbad
    CA, next two) and Globalmed Technologies (Napa CA, K210948 in 2021), so the name
    on the box today is not the company that filed the older devices. Under 180 words,
    no founding-history essay; its job is to link omnilux-clear-u and whatever Omnilux
    CLEAR page gets built, and to record the entity change. openFDA only.'
