  source: 'Applicant of record on 10 FDA 510(k) clearances per openFDA (ESPADA K162450,
    BEAR K200803, BEAR 2 Body K232242, PEACH 2 K231977, Luna 4 plus K241102, and five
    FAQ LED devices K222012/K240378/K240616/K242747/K253683). The site now has a FOREO
