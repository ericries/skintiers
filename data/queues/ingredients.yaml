  priority: 5
  status: pending
  discovered_from: brightening
  source: Common OTC tyrosinase-inhibitor brightener (hydroquinone derivative); needed
    for the brightening/melasma tier lists
- name: Lactobionic acid
  type: ingredient
  priority: 4
  status: done
  discovered_from: exfoliating-acids-by-strength
  source: A polyhydroxy acid (PHA) explicitly named on the exfoliating-acids-by-strength
    ladder as a gentler, slow-penetrating option not yet profiled; sits below lactic
    acid on the penetration axis. Larger molecule, strong humectant, low-irritation
    exfoliant.
- name: Capryloyl salicylic acid (LHA)
  type: ingredient
  priority: 4
  status: pending
  discovered_from: la-roche-posay-effaclar-duo
  source: A lipophilic derivative of salicylic acid (LHA) used as a surface exfoliant
    across several on-site products (La Roche-Posay Effaclar Duo/Mat, CeraVe SA).
    Larger, more lipophilic than salicylic acid, so it exfoliates more superficially;
    would extend the exfoliating-acids-by-strength ladder.
- name: Hydroxyethyl urea
  type: ingredient
  priority: 5
  status: pending
  discovered_from: gold-bond-rough-and-bumpy-daily-skin-therapy
  source: A urea-derived humectant (distinct from urea itself, so it does not inherit
    urea's keratolytic evidence) appearing in on-site formulas (Gold Bond Rough &
    Bumpy, Aestura Atobarrier). A short page would let those products link to it cleanly
    instead of hand-waving 'urea derivative.'
- name: Cholecalciferol (topical vitamin D)
  type: ingredient
  priority: 5
  status: done
  discovered_from: cerave-sa-body-lotion-for-rough-and-bumpy-skin
  source: 'Topical vitamin D3 appears in several on-site formulas (CeraVe SA lotion,
    others) and is marketed with antioxidant claims; a short evidence page would let
    products link out instead of hand-waving. Note: distinct from the vitamin-d-topical
    page if that covers a different form - dedupe at draft time.'
- name: Ectoin
  type: ingredient
  priority: 5
  status: pending
  discovered_from: null
  source: A bacterial-derived protective osmolyte/extremolyte used as a humectant
    and barrier/anti-irritant agent; already appears in on-site formulas (e.g. Dr.G
    Green Mild Up Sun) with no ingredient page to link to. Has small controlled trials
    in atopic dermatitis and rhinitis. Dedup vs any existing osmolyte page at draft
    time.
- name: Matrixyl (palmitoyl pentapeptide-4)
  type: ingredient
  priority: 4
  status: pending
  discovered_from: best-peptide-serums
  source: The best-known signal/matrix peptide (palmitoyl pentapeptide-4, and Matrixyl
    3000 with palmitoyl tripeptide-1/tetrapeptide-7); appears in many on-site peptide
    products but has no ingredient page. Needed to populate a Peptides-by-evidence
    ladder. Manufacturer (Sederma) collagen-stimulation data + a few small trials
    - grade conservatively.
