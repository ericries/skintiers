- name: 'Creator video links 404: build.py emits <creator_slug>-videos.html pages
    that are never generated'
  type: person
  priority: 2
  status: done
  discovered_from: null
  source: 'FOUND 2026-11-21 while scoping the Kristin Leite rename. build.py:1921
    creator_href returns f''{cs}.html'' if the creator_slug matches a person page
    slug, otherwise f''{cs}-videos.html''. Nothing in the build ever writes a *-videos.html
    file: ls _site/*-videos.html returns zero. Result is 57 DISTINCT broken hrefs
    across 81 rendered pages, every one a creator byline on a video card. Two possible
    fixes and the choice is a design decision, not a cleanup: (a) generate a per-creator
    video index page at that path, which is real new surface area, or (b) render the
    byline as plain text when no person page exists, which is smaller and loses nothing
    a reader has today since the link is dead. This is the same class as the xref-render
    gap: sk lint and sk verify read SOURCE, so no gate sees a dead href in rendered
    HTML. A render-smoke-test that walks _site for internal hrefs with no target file
    would catch this and was already noted as the next win. Do NOT add that test before
    fixing the bug, since it would fail on 81 pages and turn CI red WITHDRAWN 2026-11-22:
    THE FINDING WAS WRONG. There are no broken creator links. Re-tested properly by
    extracting every href matching *-videos.html from the rendered site and checking
    each against disk: 57 distinct hrefs, 57 files present, ZERO missing. build.py
    does generate one chronological feed page per creator at {creator_slug}-videos.html
    (the loop over creator_feeds near line 2152), exactly matching what creator_href
    emits. HOW I GOT IT WRONG: I ran ''ls _site/*-videos.html 2>/dev/null | wc -l''
    and read the 0 as proof no such files existed. In zsh a glob that fails to match
    aborts the command, so ls never ran and wc counted an empty stream; the 2>/dev/null
    hid the nomatch error that would have told me. The individual check on kristin-leite-videos.html
    was made against a _site that had not been rebuilt. LESSON: never infer absence
    from a shell glob returning nothing. Test existence per path in Python, as the
    re-test above did'
