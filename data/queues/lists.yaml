- name: OTC antifungals ranked by evidence
  type: list
  priority: 5
  status: pending
  discovered_from: tolnaftate
  source: 'Now buildable: terbinafine, clotrimazole, ketoconazole and tolnaftate all
    have pages, and Crawford 2007 Cochrane (PMID 17636672) supplies ONE axis across
    all of them. The list must be built to defuse rather than repeat the trap the
    tolnaftate page identifies: the placebo-controlled pooled RRs (allylamines 0.33,
    azoles 0.30, ciclopiroxolamine 0.27, tolnaftate 0.19, butenafine 0.33, undecanoates
    0.29) are SEPARATE pools and ranking by them is an indirect-comparison fallacy.
    The only head-to-head evidence in the review is allylamines vs azoles, RR 0.63
    favouring allylamines. So the by: axis should be head-to-head evidence first,
    with the placebo pools shown but explicitly labelled as non-comparable.'
- name: What FDA clearance does and does not prove for skincare devices
  type: list
  priority: 5
  status: done
  discovered_from: neutrogena-light-therapy-acne-mask-plus
  source: 'The site now has THREE worked examples of the same gap and no page explaining
    it: revive-light-therapy-wrinkle-and-acne-led-device (Special 510(k), only change
    was software, testing section is software validation), neutrogena-light-therapy-acne-mask-plus
    (Traditional 510(k) against a third party predicate, Performance Data is BENCH
    testing), and home-use-skincare-devices-by-evidence which has to warn that a clearance
    is not an evidence grade. Primary quotes already transcribed on those pages, including
    the FDA''s own sentence that clearance ''does not mean that FDA has made a determination
    that your device complies with other requirements of the Act''. This overlaps
    the already-queued ''What FDA approval, clearance and OTC monograph actually mean
    in skincare''; MERGE them rather than building both.'
