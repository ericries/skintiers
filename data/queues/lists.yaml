  status: pending
  discovered_from: foreo-luna-4-plus
  source: 'A sharp axis the site can now populate from primary files, and the pattern
    only became visible after four device pages. PERIORBITAL ONLY: foreo-luna-4-plus
    (K241102, ''RED+NIR: indicated to treat periorbital wrinkles'') and home-fractional-nonablative-laser
    (Tria FANp K141868, ''treatment of periorbital wrinkles (crow''''s feet)''). BROADER:
    revive-light-therapy-led-cleansing-system (K180445, ''intended for use in treating
    wrinkles''), foreo-faq-led-masks (K253683, ''treatment of wrinkles''), newa-skin-therapy-system
    (DEN150005, ''mild to moderate facial wrinkles for adult women who have Fitzpatrick
    Skin Types I-IV''). Curatorial only; every quote already verified on its product
    page. The reader value is that a device sold for facial rejuvenation may be cleared
    only for the eye area.'
- name: SPF lip balms by what their FDA label actually claims
  type: list
  priority: 5
  status: pending
  discovered_from: jack-black-intense-therapy-lip-balm-spf-25
  source: 'A buildable axis once two or three lip SPL pages exist, and the Jack Black
    page shows why it matters: its entire sunscreen claim is ''Helps prevent sunburn
    and chapped lips'', with NO broad-spectrum designation, no water resistance, no
    skin-cancer claim and no reapplication interval, verified by searching the full
    SPL text. DailyMed returns 158 results for lip balm sunscreen, so the label variation
    across cheap drugstore sticks is likely large and completely invisible on the
    shelf. Curatorial only; every claim must be read off an SPL, not off marketing.'
- name: Study pages recorded as unusable, and what made them so
  type: list
  priority: 5
  status: pending
  discovered_from: amin-2025-oral-hyaluronic-acid-meta-analysis
  source: 'THREE study records now exist whose value is the defect they document rather
    than the finding they report: karimi-2025-neurocosmetic-post-procedure-cream (PubMed-indexed
    as an RCT with no n, no allocation and no statistic), amin-2025-oral-hyaluronic-acid-meta-analysis
    (significance with no effect size, two-database search, three null outcomes narrated
    as ''a general trend of improvement''), and wang-2025-encorelane-sensitive-skin
    (every author employed by the ingredient''s owner, declaring no conflict). Curatorial
    only, over pages that already exist. The axis is HOW a paper can look like evidence
    without being usable, which is directly useful to a reader and to future ticks.
    It must quote only what each publication record shows. FOURTH INSTANCE added 2026-10-20,
    and it is a different flavour worth including: Blaak and Staib 2022 (PMID 34957578,
    cited on sweet-almond-oil) is a review arguing plant oils should be treated as
    ACTIVE ingredients, written by both authors from ''Research & Development and
    Regulatory Affairs, Kneipp GmbH'', a natural-cosmetics company, with NO conflict
    statement recorded, and conceding in its own conclusion ''discrepancies in the
    literature and questionable study designs''. Unlike the other three this one is
    not missing data; it argues a commercial conclusion the evidence it cites does
    not support. Also note the Town 2019 hair-removal review (PMID 30681170, three
    of seven authors at Philips Research).'
- name: Ingrown hair and razor bump products by evidence
  type: list
  priority: 5
  status: pending
  discovered_from: folliculitis
  source: 'GROUNDED in a real gap found while clearing a folliculitis maintenance
    flag. Three ingrown-hair PRODUCTS are published and link the folliculitis hub
    but cannot join its tier_list, which grades bacterial versus fungal evidence:
    fur-ingrown-concentrate, fur-ingrown-eliminator-serum and tend-skin-the-skin-care-solution
    (its active is acetylsalicylic acid). Meanwhile ingrown-hairs and pseudofolliculitis-barbae
    BOTH carry the identical tier_list of retinoids, glycolic-acid and salicylic-acid,
    i.e. actives only, with no product graded on either. So three real products on
    the site are currently ranked nowhere. Curatorial only, over pages that already
    exist. ALSO WORTH DECIDING: ingrown-hairs and pseudofolliculitis-barbae have identical
    tier_lists and may be duplicate hubs, which is a merge question for the user rather
    than something to paper over.'
- name: Home LED devices sold for BODY acne (back and chest)
  type: list
  priority: 5
  status: pending
  discovered_from: revive-light-therapy-lux-panel
  source: 'Grounded in revive-light-therapy-lux-panel, shipped 2026-10-21, which is
    the first device on the site sold for ''face, neck, chest, back, and more''. The
    gap it exposes is real and currently unaddressed: the 2026 GRADE review (PMID
    42545315) that supplies every LED grade here covers FACIAL acne and FACIAL rejuvenation,
    so no graded evidence on this site covers back or chest LED treatment at all.
    A short list would exist mainly to say that out loud and route readers to body-acne.
    Do NOT build it until at least two body-positioned devices have pages; one item
    is not a list.'
- name: How sensitive skin is measured in trials
  type: list
  priority: 5
  status: pending
  discovered_from: sensitive-skin
  source: 'Grounded in the ''What the label actually means'' section added to sensitive-skin
    on 2026-10-21. The IFSI Delphi consensus definition (PMID 26939643) specifies
    NO diagnostic test, which leaves every sensitive-skin product claim resting on
    whatever the trial chose to do. DO NOT BUILD THIS FROM MEMORY: the methods commonly
    named in this literature (lactic acid sting test, SLS provocation, capsaicin)
    were deliberately NOT asserted on the hub because the IFSI abstract contains none
    of them (string-checked: test 0 hits, lactic 0, capsaicin 0). Find and read primary
    validation papers for each method first, and if the validation turns out to be
    thin, that IS the finding. Would let every future sensitive-skin claim on the
    site be read against a real definition.'
- name: Home LED devices by published irradiance
  type: list
  priority: 5
  status: pending
  discovered_from: revive-light-therapy-lux-lip-care
  source: 'Grounded in the K172662 chart read 2026-10-21, which is the first filing
    in this cluster to publish an Energy Level row: 67.7, 62.07, 70.16 and 61.59 mW/cm2
    for four LED Technologies devices, with treatment areas of 24, 30, 415 and 28
    cm2. Irradiance is the variable that decides whether an LED device does anything
    and nearly every brand page omits it, so a list ranking covered devices by PUBLISHED
    dose, with an explicit tier for ''does not disclose'', would be genuinely useful
    and is not duplicated by home-use-skincare-devices-by-evidence (which ranks MODALITIES
    by GRADE level). BUILD ONLY from numbers printed in a filing or on a brand page;
    never estimate, and never infer a retail unit''s output from a similarly specced
    clearance. Needs at least 3-4 devices with real figures first.'
