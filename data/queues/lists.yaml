    reVive LED Cleansing System filings (K180445 and K180447) state verbatim that
    ''The conclusions drawn from nonclinical tests demonstrate that the device is
    safe, as effective, and performs as well as the legally marketed devices'', the
    same sentence found at every generation of the chain (K223482 to K210965/K210968
    to K180445/K180447). So the list can state that an entire product line''s clearances
    rest on nonclinical testing, sourced not inferred. Shipped as home-led-devices-by-what-the-file-publishes:
    a three-rung disclosure ranking built from the openFDA statement_or_summary field
    rather than from brand copy, with 21 CFR 807.92 and 807.93 as the primary basis
    for what a Summary must and need not contain.'
- name: Melasma treatments by evidence
  type: list
  priority: 5
  status: done
  discovered_from: heydari-2025-oral-vs-topical-tranexamic-acid-melasma
  source: 'No melasma-specific tier list exists; the two nearest lists are best-products-dark-spots-hyperpigmentation
    and best-hydroquinone-free-brightening-products, both of which are broader pigment
    lists rather than melasma. Pages that already exist and would populate it: tranexamic-acid,
