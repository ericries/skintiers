- name: Home LED devices by what the brand actually proves, not what it claims
  type: list
  priority: 5
  status: done
  discovered_from: revive-light-therapy-lux-glo
  source: 'Five home-LED product pages now exist (revive-light-therapy-lux-glo, revive-light-therapy-lux-spot,
    revive-light-therapy-essentials, neutrogena-light-therapy-acne-mask-plus, pulsaderm-acne-mask-28,
