- name: OTC antifungal creams by regulatory footing and labelled scope
  type: list
  priority: 5
  status: done
  discovered_from: lotrimin-ultra-athletes-foot-cream
  source: 'A real axis the site can now populate: lotrimin-ultra-athletes-foot-cream
    is FDA-APPROVED under NDA021307, while tinactin-antifungal-cream is an OTC monograph
    tolnaftate product. Ingredient pages exist for butenafine, clotrimazole, terbinafine
    and tolnaftate. The second column should be LABELLED SCOPE, not just approval:
    Lotrimin Ultra volunteers that effectiveness on the bottom or sides of the foot
    is unknown, and whether its competitors make the same admission is the comparison
    a reader cannot currently make. Curatorial only; build after at least one more
    antifungal product page exists. NOW BUILDABLE, note added 2026-10-19: three product
    pages exist and the axis has hard codes on both columns. lotrimin-ultra-athletes-foot-cream
    is FDA-APPROVED (C73594 NDA, NDA021307), claiming athlete''s foot between the
    toes plus jock itch and ringworm. lotrimin-af-antifungal-cream is an OTC MONOGRAPH
    drug (C200263, M005) claiming ringworm ONLY despite its AF name. tinactin-antifungal-cream
    is monograph tolnaftate. The LABELLED SCOPE column is where the surprises are:
    Ultra volunteers that effectiveness on the bottom or sides of the foot is unknown,
    and AF states it is not effective on scalp or nails.'
