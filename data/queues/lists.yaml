- name: Home-use skincare devices ranked by evidence
  type: list
  priority: 5
  status: done
  discovered_from: home-led-light-therapy
  source: 'PMID 42545315, already cited on home-led-light-therapy and microneedling,
    grades six home-device modalities on ONE axis: home fractional nonablative lasers
    Level A for rejuvenation; LED and radiofrequency Level B; blue and blue-red LED
    Level B with a Grade I recommendation for acne; red LED and light-heat energy
    Level C for acne; home microneedling Level D and associated with infectious complications;
    home IPL and heat-based devices Level D and not recommended. A single-source single-axis
    ladder, the tier_list shape this site handles best. Two rows already have pages
    (home-led-light-therapy, microneedling); Fractional CO2 laser resurfacing is already
    pending in the goal queue, so build this AFTER that page exists or flag the missing
    rows in prose.'
- name: What FDA approval, clearance and OTC monograph actually mean in skincare
  type: list
  priority: 5
  status: done
  discovered_from: revive-light-therapy-wrinkle-and-acne-led-device
  source: 'A reference ladder the site keeps needing and does not have. Three distinct
    regulatory statuses already appear across published pages, each meaning something
    different and each routinely marketed as if it meant efficacy: (1) 510(k) SUBSTANTIAL
    EQUIVALENCE for devices, documented on revive-light-therapy-wrinkle-and-acne-led-device,
    where the FDA letter itself says clearance does not mean the agency determined
    compliance with other requirements of the Act; (2) OTC MONOGRAPH, e.g. clotrimazole
    under citation M005, where the active is accepted without trials of that product;
    (3) NDA APPROVAL, e.g. delgocitinib under NDA219155, which does require efficacy
    data. A fourth, unapproved drug other, is recorded in memory for older sulfacetamide/sulfur
    products. Each tier can be sourced to a primary FDA document already cited on
    an existing page, so this is assembly, not new research.'
- name: Acne scar procedures ranked by evidence
  type: list
  priority: 5
  status: done
  discovered_from: platelet-rich-plasma-acne-scars
  source: 'Now buildable: three procedure pages exist (microneedling, subcision, platelet-rich-plasma-acne-scars)
    and Fractional CO2 laser resurfacing is already pending in the goal queue. FOUR
    pages on this site now each carry a separate note explaining why they cannot host
    a ranking, which is the signal that the ranking belongs in one list. Spine is
    PMID 41081097 (68 RCTs, 4480 patients): laser+PRP best on ECCA (SUCRA 98.4%),
    laser+filler best on GBS (72.1%), laser+chemical peels best on satisfaction (89.6%),
    microneedling most tolerable for pain (72.6%), and no treatment reduced erythema
    or PIH risk. Build AFTER the fractional CO2 page, and make the by: axis name WHICH
    outcome scale is being ranked, since the winner changes with the scale.'
- name: Acne scar treatments ranked by downtime and pain
  type: list
  priority: 5
  status: pending
  discovered_from: fractional-co2-laser-resurfacing
  source: 'A second axis the evidence actually supports and the planned efficacy list
    will not cover. PMID 42720808 gives hard comparative numbers for tolerability
    where efficacy is uncertain: CO2 vs erbium pain MD 1.86 (95% CI 1.33-2.39) and
    downtime MD 3.67 days (95% CI 1.90-5.44), both excluding the null, while the efficacy
    advantage does not survive the randomized-only analysis. PMID 41081097 adds that
    microneedling ranked most tolerable for pain (SUCRA 72.6%), and PMID 42771826
    that needling may offer better tolerability and pigment safety than ablative lasers.
    For many readers downtime is the deciding variable, and it is the better-evidenced
    one.'
