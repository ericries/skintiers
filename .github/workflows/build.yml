name: Build and Deploy
on:
  push:
    branches: [main]
  # Lets a failed deploy be re-triggered cleanly from the Actions tab.
  # `gh run rerun --failed` CANNOT be used here: this workflow is a single job,
  # so a rerun re-executes upload-pages-artifact and the deploy step then aborts
  # with "Multiple artifacts named github-pages were unexpectedly found".
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4    # so the JS<->Python codec/dashboard parity test runs for real
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q   # gate the deploy on a green suite (incl. JS parity)
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # _site is ~155 MB over ~3.4k files (83 MB of it product photos), and
          # the action's 10-minute default expired mid `syncing_files` on
          # 2026-11-06 after a backlog deploy. 20 minutes leaves headroom.
          timeout: 1200000
